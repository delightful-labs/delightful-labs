packages:
  - 'apps/*'
  - 'packages/*'
  - 'apps/finance/tooling/worker-state-tests'
  - 'apps/clipper/apps/*'

patchedDependencies:
  '@kingironman2011/better-auth-bsky@0.3.2': apps/clipper/patches/better-auth-bsky-0.3.2-better-auth-1.7.patch
  jazz-tools@2.0.0-alpha.60: patches/jazz-tools@2.0.0-alpha.60.patch

# Keep injected peer-specific UI copies current after packaging.
syncInjectedDepsAfterScripts:
  - package

# These published chart utilities import Svelte but omit its peer declaration.
# Declare it so each consumer resolves its own Svelte instead of a hoisted copy.
packageExtensions:
  '@layerstack/utils@2.0.0-next.19':
    peerDependencies:
      svelte: '^5.0.0'
  '@layerstack/svelte-state@0.1.0-next.25':
    peerDependencies:
      svelte: '^5.0.0'
  '@layerstack/svelte-actions@1.0.1-next.20':
    peerDependencies:
      svelte: '^5.0.0'

# Existing Clipper compatibility allowance; scoped to this SDK's peer.
peerDependencyRules:
  allowedVersions:
    'jazz-tools@2.0.0-alpha.60>better-auth': '1.7.18'

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - protobufjs
