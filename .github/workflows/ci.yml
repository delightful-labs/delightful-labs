name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      website: ${{ steps.selection.outputs.website }}
      ui: ${{ steps.selection.outputs.ui }}
      local_first: ${{ steps.selection.outputs.local_first }}
      finance: ${{ steps.selection.outputs.finance }}
      clipper: ${{ steps.selection.outputs.clipper }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - id: selection
        run: node scripts/monorepo/ci.mjs
        working-directory: .
      - run: node scripts/monorepo/check-guidance.mjs
        working-directory: .
      - run: node --test scripts/monorepo/ci.test.mjs scripts/monorepo/guidance.test.mjs
        working-directory: .

  verify:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.website == 'true') }}
    runs-on: ubuntu-24.04
    container:
      # Match the frozen Playwright version; browser libraries and binaries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    timeout-minutes: 15
    steps:
      - name: Require successful check selection
        if: ${{ needs.plan.result != 'success' }}
        run: exit 1
        working-directory: .
      - name: Match container home ownership
        # Firefox requires the mounted home to belong to the effective container user.
        run: chown "$(id -u):$(id -g)" "$HOME"
        working-directory: /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-root monorepo:check-links
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:build
      - run: pnpm test:browser

  ui:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.ui == 'true') }}
    name: UI checks
    runs-on: ubuntu-24.04
    container:
      # Match the frozen Playwright version; browser libraries and binaries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    timeout-minutes: 30
    steps:
      - name: Require successful check selection
        if: ${{ needs.plan.result != 'success' }}
        run: exit 1
        working-directory: .
      - name: Match container home ownership
        # Firefox requires the mounted home to belong to the effective container user.
        run: chown "$(id -u):$(id -g)" "$HOME"
        working-directory: /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-root monorepo:check-links
      - run: pnpm ui:check
      - run: pnpm ui:test
      - run: pnpm ui:build
      - run: pnpm --filter delightful-ui exec playwright test --workers=1
      - run: pnpm --filter delightful-ui test:storybook --workers=1
      - run: pnpm --filter delightful-ui build-storybook

  local-first-package:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.local_first == 'true') }}
    name: Local First checks, consumers and browser qualification
    runs-on: ubuntu-24.04
    container:
      # Match the frozen Playwright version; browser libraries and binaries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --init --shm-size=1g
    timeout-minutes: 15
    steps:
      - name: Require successful check selection
        if: ${{ needs.plan.result != 'success' }}
        run: exit 1
        working-directory: .
      - name: Match container home ownership
        # Firefox requires the mounted home to belong to the effective container user.
        run: chown "$(id -u):$(id -g)" "$HOME"
        working-directory: /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-root monorepo:check-links
      - run: pnpm --filter delightful-local-first format:check
      - run: pnpm --filter delightful-local-first lint
      - run: pnpm --filter delightful-local-first test:xstate-readiness
      - run: pnpm --filter delightful-local-first check
      - run: pnpm dlf:test
      - run: pnpm dlf:package
      - run: pnpm --filter delightful-local-first check:consumer
      - run: pnpm --filter delightful-local-first build-storybook
      - run: pnpm --filter delightful-local-first check:native-backup
      - run: pnpm --filter delightful-local-first exec tsc --project fixtures/private-creation/tsconfig.json
      - run: pnpm --filter delightful-local-first exec vitest run --config fixtures/private-creation/vitest.config.ts
      - run: pnpm --filter delightful-local-first check:backup-restore
      - run: pnpm --filter delightful-local-first test:storybook
      - name: Upload Local First generated failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-first-xstate-test-failures
          path: packages/local-first/.xstate-test/
          retention-days: 14
          if-no-files-found: ignore
