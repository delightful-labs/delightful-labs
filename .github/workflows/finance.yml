name: Finance offline-edit investigation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-offline-edit-investigation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Original offline edits (at most 20 cases)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --init --shm-size=1g
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/finance
    steps:
      - name: Match container home ownership
        run: chown "$(id -u):$(id -g)" "$HOME"
        working-directory: /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: pnpm
      - name: Reuse existing catalogs and public library builds
        run: tar -xzf apps/finance/tests/fixtures/offline-edit-ci-assets.tgz
        working-directory: .
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --workspace-root monorepo:check-links
      - name: Prepare SvelteKit without catalog generation
        run: pnpm exec svelte-kit sync
        env:
          FINANCE_PREVIEW: "true"
      - name: Run original offline-edit cases without retries
        run: >-
          pnpm exec playwright test transaction-edit.e2e.ts
          --config=playwright.config.ts --project=application
          --grep='^imported (expense|income) supports category, tag and note edits offline without changing provenance$'
          --repeat-each=10 --workers=2 --retries=0 --max-failures=1
          --trace=on --forbid-only
      - name: Retain all probe diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-edit-investigation
          path: apps/finance/test-results/
          retention-days: 7
